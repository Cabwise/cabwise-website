<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Cabwise — iPhone &amp; Android</title>
  <meta name="description" content="Download Cabwise Driver for iPhone from the App Store or for Android from Google Play. Stay safe. Decide fast. Earn more.">
  <link rel="canonical" href="https://cabwise.app/download">
  <meta property="og:title" content="Download Cabwise">
  <meta property="og:description" content="Get Cabwise on iPhone or Android — choose your store below.">
  <meta property="og:url" content="https://cabwise.app/download">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/cabwise-icon-512.png" type="image/png">
  <style>
    :root {
      --bg: #0b1412;
      --bg-elevated: #0f1a17;
      --card: #12201c;
      --text: #f4f7f6;
      --muted: #9aa8a3;
      --accent: #00e6a8;
      --accent-dim: rgba(0, 230, 168, 0.12);
      --accent-glow: rgba(0, 230, 168, 0.35);
      --border: #1e332c;
      --radius: 14px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 230, 168, 0.18), transparent 55%),
        linear-gradient(180deg, #0f1a17 0%, var(--bg) 45%, #07100e 100%);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 24px 56px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      margin-bottom: 36px;
    }
    .brand:hover { text-decoration: none; opacity: 0.95; }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
    }

    h1 {
      font-size: clamp(1.85rem, 6vw, 2.35rem);
      line-height: 1.15;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 0 8px;
    }

    .tagline {
      color: var(--accent);
      font-weight: 600;
      font-size: 1rem;
      margin: 0 0 32px;
    }

    .store-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 22px 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
    }

    .store-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .store-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .store-link {
      display: inline-block;
      line-height: 0;
      border-radius: 10px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .store-link:hover {
      text-decoration: none;
      transform: translateY(-2px);
      opacity: 0.96;
    }
    .store-link img {
      height: 64px;
      width: auto;
      display: block;
    }
    .store-link.apple img {
      height: 54px;
      margin: 5px 0;
    }

    .hint {
      margin: 18px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .hint strong { color: var(--text); font-weight: 600; }

    .footer-links {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      font-size: 0.9rem;
    }
    .footer-links a { color: var(--muted); font-weight: 500; }
    .footer-links a:hover { color: var(--accent); text-decoration: none; }

    .legal {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .store-link:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="/" aria-label="Cabwise home">
      <img class="brand-logo" src="/assets/cabwise-icon-512.png" width="48" height="48" alt="">
      <span>Cabwise</span>
    </a>

    <h1>Download Cabwise</h1>
    <p class="lead">Choose your phone — then install from the official store.</p>
    <p class="tagline">Stay safe. Decide fast. Earn more.</p>

    <div class="store-card">
      <p>Available on the App Store and Google Play.</p>
      <div class="store-buttons">
        <a
          class="store-link apple"
          id="btn-apple"
          href="https://apps.apple.com/app/cabwise-driver/id6807179238"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Download Cabwise on the App Store">
          <img
            src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-gb?size=250x83"
            width="180"
            height="54"
            alt="Download on the App Store">
        </a>
        <a
          class="store-link"
          id="btn-play"
          href="https://play.google.com/store/apps/details?id=com.cabwise.app"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Get Cabwise on Google Play">
          <img
            src="https://play.google.com/intl/en_gb/badges/static/images/badges/en_badge_web_generic.png"
            width="216"
            height="64"
            alt="Get it on Google Play">
        </a>
      </div>
      <p class="hint" id="device-hint" hidden></p>
    </div>

    <nav class="footer-links" aria-label="Site">
      <a href="/">Home</a>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="mailto:support@cabwise.app">Support</a>
    </nav>
    <p class="legal">Operated by Bellsle Ltd · United Kingdom</p>
  </main>

  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var hint = document.getElementById("device-hint");
      var apple = document.getElementById("btn-apple");
      var play = document.getElementById("btn-play");
      if (/iPhone|iPad|iPod/i.test(ua)) {
        hint.hidden = false;
        hint.innerHTML = "We detected an <strong>iPhone</strong> — use the App Store button above.";
        apple.style.outline = "2px solid var(--accent)";
        apple.style.outlineOffset = "4px";
      } else if (/Android/i.test(ua)) {
        hint.hidden = false;
        hint.innerHTML = "We detected <strong>Android</strong> — use the Google Play button above.";
        play.style.outline = "2px solid var(--accent)";
        play.style.outlineOffset = "4px";
      }
    })();
  </script>
</body>
</html>
